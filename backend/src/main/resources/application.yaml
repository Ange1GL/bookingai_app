spring:
  config:
    import: optional:file:.env[.properties]

  # Perfil activo por defecto: "dev" (application-dev.yaml) para poder probar con Postman sin CSRF.
  # En qa/producción, sobreescribir explícitamente con la variable de entorno SPRING_PROFILES_ACTIVE=qa
  # (o el flag --spring.profiles.active=qa) — si no se sobreescribe, el entorno queda en modo dev inseguro.
  profiles:
    active: dev

  application:
    name: bookingapp
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 30000
      pool-name: bookingAppPoolConnection
      max-lifetime: 200000
      connection-timeout: 30000

  jpa:
    hibernate:
      # validate (no update): el schema lo gestiona Flyway (src/main/resources/db/migration).
      # Hibernate solo verifica al arrancar que las entidades coincidan con las tablas reales;
      # si falta una migracion, la app no levanta en vez de parchear la BD por su cuenta.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

  ai:
    model:
      chat: deepseek
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
      
security:
  jwt:
    private-key: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private.pem}
    public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public.pem}
    expiration: 15               # minutos, vida del access token
    refresh-expiration: 43200    # minutos = 30 dias, vida del refresh token
    issuer: bookingapp-api
    audience: bookingapp-frontend

  cookie:
    http-only: true
    same-site: Lax              # Strict bloquea el envio cross-port en dev (localhost:4200 -> localhost:8082)
    # "secure" no se define aqui: es especifico de cada perfil (ver application-dev.yaml / application-qa.yaml)
    access:
      name: access_token
      path: /api
      max-age: 900               # segundos = 15 min, debe coincidir con jwt.expiration
    refresh:
      name: refresh_token
      path: /api/v1/auth/refresh
      max-age: 2592000           # segundos = 30 dias, debe coincidir con jwt.refresh-expiration

  # security.csrf.enabled tampoco se define aqui: ver application-dev.yaml / application-qa.yaml y docs/csrf-decision.md

cors:
  allowed-origins:
    - http://localhost:4200
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Authorization
  allow-credentials: true
  max-age: 3600

server:
  port: 8082

