spring:
  config:
    import: optional:file:.env[.properties]

  # Perfil activo por defecto: "dev" (application-dev.yaml) para poder probar con Postman sin CSRF.
  # En qa/producción, sobreescribir explícitamente con la variable de entorno SPRING_PROFILES_ACTIVE=qa
  # (o el flag --spring.profiles.active=qa) — si no se sobreescribe, el entorno queda en modo dev inseguro.
  profiles:
    active: dev

  application:
    name: bookingapp
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      idle-timeout: 30000
      pool-name: bookingAppPoolConnection
      max-lifetime: 200000
      connection-timeout: 30000

  jpa:
    hibernate:
      # validate (no update): el schema lo gestiona Flyway (src/main/resources/db/migration).
      # Hibernate solo verifica al arrancar que las entidades coincidan con las tablas reales;
      # si falta una migracion, la app no levanta en vez de parchear la BD por su cuenta.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  # Dictado por voz: spring.servlet.multipart corta la subida antes de leerla completa en memoria.
  # El limite fino (y su mensaje) lo aplica assistant.voice.max-audio-bytes.
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

  ai:
    # El starter de OpenAI activa TODOS sus modelos por defecto (matchIfMissing=true): solo se usa la
    # transcripcion; el chat sigue con DeepSeek y el resto se apaga para no crear clientes innecesarios.
    model:
      chat: deepseek
      audio:
        transcription: openai
        speech: none
      embedding: none
      image: none
      moderation: none
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-flash
          temperature: 0.7
    openai:
      # Sin valor por defecto a proposito: si falta, la app no arranca. Ver docs/voice-transcription.md
      api-key: ${API_OPENAI_KEY}
      audio:
        transcription:
          model: gpt-4o-mini-transcribe   # el modelo ligero (~0.003 USD/min)
          language: es
          temperature: 0
          # Vocabulario del dominio: mejora nombres y horas. Son pocos tokens de texto.
          prompt: "Dictado para un asistente de citas de una barbería: agendar, mover o cancelar citas, nombres de clientes, servicios, días y horas."
          # Sin reintentos: cada reintento podria volver a cobrarse. El usuario decide si reintenta.
          max-retries: 0
          # Por debajo de los 30 s de API Gateway; transcribir 30 s de audio tarda 1-3 s.
          timeout: 15s

assistant:
  voice:
    min-audio-bytes: 1024          # menos que esto es un blob vacio o corrupto
    max-audio-bytes: 524288        # 512 KB: 30 s de opus ~110 KB; Safari (AAC) pesa mas
    daily-limit-per-user: 40       # dictados por usuario y dia de negocio
    # Tope GLOBAL mensual: acota el gasto aunque todos los usuarios agoten su cuota.
    # Peor caso: 1500 x 30 s = 750 min x 0.003 USD = 2.25 USD/mes. Ver docs/voice-transcription.md
    monthly-limit: 1500

whatsapp:
  webhook:
    # Sin valores por defecto a proposito: si faltan, la app no arranca. Ver docs/whatsapp-webhook.md
    verify-token: ${WHATSAPP_VERIFY_TOKEN}   # el que se pega en el panel de Meta
    app-secret: ${WHATSAPP_APP_SECRET}       # Meta > Configuracion de la app > Basica; firma los POST
  cloud:
    # Envio de respuestas. Vacio a proposito por defecto: sin token la app arranca en modo demo (solo log).
    system-user-token: ${SYSTEM_USER_EMPLOYEE_META:}   # token permanente del usuario del sistema de Meta
    api-version: v26.0
    base-url: https://graph.facebook.com

security:
  jwt:
    # Secreto HS256 en base64 (>= 32 bytes decodificados). Dev: .env; QA: Parameter Store via ECS.
    # Sin valor por defecto a proposito: si falta, la app no arranca. Ver docs/jwt-secret.md.
    secret: ${JWT_SECRET}
    expiration: 15               # minutos, vida del access token
    refresh-expiration: 43200    # minutos = 30 dias, vida del refresh token
    issuer: bookingapp-api
    audience: bookingapp-frontend
    revocation-cleanup:
      interval-minutes: 5                    # cada cuanto corre el job de limpieza de revoked_access_token
      clock-skew-safety-margin-minutes: 5     # debe ser mayor que la tolerancia de reloj del JwtDecoder (~60s)

  account-lock:
    reset-cleanup:
      interval-minutes: 5   # cada cuanto corre el job que desbloquea cuentas cuyo tiempo de bloqueo ya expiro

  cookie:
    http-only: true
    same-site: Lax              # Strict bloquea el envio cross-port en dev (localhost:4200 -> localhost:8082)
    # "secure" no se define aqui: es especifico de cada perfil (ver application-dev.yaml / application-qa.yaml)
    access:
      name: access_token
      path: /api
      max-age: 900               # segundos = 15 min, debe coincidir con jwt.expiration
    refresh:
      name: refresh_token
      path: /api/v1/auth/refresh
      max-age: 2592000           # segundos = 30 dias, debe coincidir con jwt.refresh-expiration

  rate-limit:
    enabled: true
    capacity: 60        # peticiones permitidas por ventana, por IP
    window: 1m           # ventana de refill del bucket (token bucket, refill greedy)
    cache:
      expire-after-access: 5m   # debe ser >= window; libera buckets de IPs inactivas
      maximum-size: 10000        # techo duro de entradas en memoria (evita fuga si hay muchas IPs)

  client-ip:
    # Proxies de confianza que agregan su entrada a X-Forwarded-For delante de la app. 0 = conexion directa
    # (dev). Con CloudFront -> API Gateway -> VPC Link, 1 (env SECURITY_CLIENT_IP_TRUSTED_PROXY_HOPS=1).
    trusted-proxy-hops: 0

  # security.csrf.enabled tampoco se define aqui: ver application-dev.yaml / application-qa.yaml y docs/csrf-decision.md

app:
  # Zona horaria del negocio: las fechas de las citas son hora local en esta zona (sin offset en la API).
  # Es la unica referencia de "ahora" para validaciones, jobs y la IA (ver ClockConfig).
  timezone: America/Mexico_City

cors:
  allowed-origins:
    - http://localhost:4200
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
  exposed-headers:
    - Authorization
    - X-RateLimit-Remaining
    - Retry-After
  allow-credentials: true
  max-age: 3600

server:
  port: 8082

# Actuator: solo /actuator/health, sin detalle. Es el health check de ECS Fargate / ALB (ver docs/actuator-health.md).
management:
  endpoints:
    web:
      exposure:
        include: health      # allowlist: ningun otro endpoint (env, beans, metrics, ...) queda expuesto por HTTP
  endpoint:
    health:
      show-details: never    # solo {"status":"UP"}; no revela estado de la BD ni de otros componentes
      show-components: never
