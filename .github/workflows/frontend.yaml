name: Deploy frontend to Amazon S3 and CloudFront

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  S3_BUCKET: aglacita-qa-front
  NODE_VERSION: "22"
  BUILD_DIR: frontend/dist/diamond-ng/browser
  # Archivos con hash en el nombre (js, css, fuentes...): nunca cambian de contenido.
  CACHE_IMMUTABLE: public, max-age=31536000, immutable
  # index.html referencia los archivos con hash: debe revalidarse siempre.
  CACHE_REVALIDATE: no-cache

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate CloudFront distribution id
        working-directory: .
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "::error::Define la variable de repositorio CLOUDFRONT_DISTRIBUTION_ID (Settings > Secrets and variables > Actions > Variables)"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::707256068332:role/aglacita-frontend-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets to S3
        working-directory: .
        run: |
          aws s3 sync "$BUILD_DIR" "s3://$S3_BUCKET" \
            --delete \
            --exclude "index.html" \
            --exclude "ngsw.json" \
            --exclude "ngsw-worker.js" \
            --exclude "safety-worker.js" \
            --exclude "worker-basic.min.js" \
            --exclude "manifest.webmanifest" \
            --cache-control "$CACHE_IMMUTABLE"

      # El service worker y su manifiesto NO llevan hash en el nombre: si se cachean como inmutables, los
      # navegadores se quedan con un service worker viejo y nunca reciben la versión nueva.
      - name: Upload service worker files to S3
        working-directory: .
        run: |
          for file in ngsw.json ngsw-worker.js safety-worker.js worker-basic.min.js; do
            if [ -f "$BUILD_DIR/$file" ]; then
              aws s3 cp "$BUILD_DIR/$file" "s3://$S3_BUCKET/$file" --cache-control "$CACHE_REVALIDATE"
            fi
          done
          aws s3 cp "$BUILD_DIR/manifest.webmanifest" "s3://$S3_BUCKET/manifest.webmanifest" \
            --cache-control "$CACHE_REVALIDATE" \
            --content-type "application/manifest+json"

      - name: Upload index.html to S3
        working-directory: .
        run: |
          aws s3 cp "$BUILD_DIR/index.html" "s3://$S3_BUCKET/index.html" \
            --cache-control "$CACHE_REVALIDATE"

      - name: Invalidate CloudFront cache
        working-directory: .
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID"
