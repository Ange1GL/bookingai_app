<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
  <div class="flex flex-col gap-2">
    <label for="username">Usuario</label>
    <input pInputText id="username" formControlName="username" autocomplete="username" />
    @if (form.controls.username.touched && form.controls.username.hasError('required')) {
      <small class="text-red-500">El usuario es obligatorio.</small>
    }
  </div>

  <div class="flex flex-col gap-2">
    <label for="password">Contraseña</label>
    <p-password
      inputId="password"
      formControlName="password"
      [feedback]="false"
      [toggleMask]="true"
      autocomplete="current-password"
      styleClass="w-full"
      inputStyleClass="w-full"
    />
    @if (form.controls.password.touched && form.controls.password.hasError('required')) {
      <small class="text-red-500">La contraseña es obligatoria.</small>
    }
  </div>

  <p-button type="submit" label="Iniciar sesión" [loading]="loading()" styleClass="w-full" />
</form>
