<app-auth-card>
  <div class="flex flex-col gap-1 text-center">
    <h2 class="m-0 text-xl font-semibold">Crea tu contraseña</h2>
    <p class="m-0 text-sm text-surface-500">
      Usa el código que te enviamos por WhatsApp para activar tu cuenta y elegir tu contraseña.
    </p>
  </div>
  <app-create-password-form [loading]="loading()" (submitted)="createPassword($event)" />
  <p class="m-0 text-center text-sm">
    ¿Ya tienes contraseña?
    <a routerLink="/auth/login" class="font-medium text-primary">Inicia sesión</a>
  </p>
</app-auth-card>
