<app-auth-card>
  <div class="flex flex-col gap-1 text-center">
    <h2 class="m-0 text-xl font-semibold">Recuperar contraseña</h2>
    <p class="m-0 text-sm text-surface-500">
      Escribe tu usuario. El administrador revisará la solicitud y se pondrá en contacto contigo con un código de acceso.
    </p>
  </div>

  @if (confirmation(); as message) {
    <p
      class="m-0 flex items-start gap-2 rounded-2xl bg-emerald-50 px-4 py-3 text-sm text-emerald-800 dark:bg-emerald-500/10 dark:text-emerald-300"
      role="status"
    >
      <i class="pi pi-check-circle mt-0.5" aria-hidden="true"></i>{{ message }}
    </p>
  } @else {
    <app-password-recovery-form [loading]="loading()" (submitted)="request($event)" />
  }

  <p class="m-0 text-center text-sm">
    <a routerLink="/auth/login" class="font-medium text-primary">Volver a iniciar sesión</a>
  </p>
</app-auth-card>
