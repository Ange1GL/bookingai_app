<app-auth-card>
  <h2 class="m-0 text-center text-xl font-semibold">Iniciar sesión</h2>
  <app-login-form [loading]="loading()" (submitted)="login($event)" />
  <p class="m-0 text-center text-sm">
    <a routerLink="/auth/password-recovery" class="font-medium text-primary">¿Olvidaste tu contraseña?</a>
  </p>
  <p class="m-0 text-center text-sm">
    ¿Te enviaron un código por WhatsApp?
    <a routerLink="/auth/create-password" class="font-medium text-primary">Crea tu contraseña</a>
  </p>
</app-auth-card>
