<div class="flex flex-col gap-3 sm:flex-row sm:items-center">
  <div class="min-w-0 flex-1">
    <app-search-input
      placeholder="Buscar por nombre, usuario, correo o teléfono"
      label="Buscar usuarios"
      [maxLength]="searchMaxLength"
      (searched)="searchChange.emit($event)"
    />
  </div>
  <div class="flex gap-2" role="group" aria-label="Filtrar usuarios por estado">
    @for (option of options; track option.value) {
      <button
        type="button"
        class="cursor-pointer rounded-full border px-4 py-2 text-sm font-medium transition"
        [class]="
          status() === option.value
            ? 'border-primary bg-primary-50 text-primary dark:bg-primary-500/10'
            : 'border-surface text-muted-color hover:bg-surface-100 dark:hover:bg-surface-800'
        "
        [attr.aria-pressed]="status() === option.value"
        (click)="statusChange.emit(option.value)"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>
